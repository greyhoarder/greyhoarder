<hlm-alert-dialog
  [state]="isOpen() ? 'open' : 'closed'"
  [disableClose]="isDeleting()"
  autoFocus="[data-slot=alert-dialog-cancel]"
  (closed)="closed.emit()"
>
  <hlm-alert-dialog-content *hlmAlertDialogPortal data-testid="box-delete-box-dialog">
    <hlm-alert-dialog-header>
      <hlm-alert-dialog-media class="bg-destructive/15 text-destructive">
        <ng-icon name="lucideTrash2" size="22" />
      </hlm-alert-dialog-media>
      <h2 hlmAlertDialogTitle>Delete {{ name() }} for good?</h2>
      <p hlmAlertDialogDescription>{{ text() }}</p>
    </hlm-alert-dialog-header>
    @if (hasFailed()) {
      <p class="px-6 pt-5 text-sm text-destructive" role="alert" data-testid="box-delete-box-error">
        Can't delete right now. Try again in a moment.
      </p>
    }
    <!-- Three buttons wrap on narrow screens instead of squeezing into two columns. -->
    <hlm-alert-dialog-footer class="flex flex-wrap *:grow *:basis-32">
      <button hlmAlertDialogCancel [disabled]="isDeleting()" data-testid="box-delete-box-cancel">Cancel</button>
      @if (canKeep()) {
        <button
          hlmAlertDialogAction
          variant="outline"
          [disabled]="isDeleting()"
          [attr.aria-busy]="isDeleting() && chosen() === 'keep'"
          data-testid="box-delete-box-keep-minis"
          (click)="keep()"
        >
          Keep built minis
        </button>
      }
      <button
        hlmAlertDialogAction
        variant="destructive"
        class="font-semibold"
        [disabled]="isDeleting()"
        [attr.aria-busy]="isDeleting() && chosen() === 'delete'"
        data-testid="box-delete-box-confirm"
        (click)="delete()"
      >
        {{ canKeep() ? 'Delete with minis' : 'Delete box' }}
      </button>
    </hlm-alert-dialog-footer>
    <!-- Last, so the focus starts on "Cancel" and not here. -->
    <button
      hlmAlertDialogCancel
      variant="ghost"
      size="icon"
      class="absolute top-3 right-3 size-9 border-0 text-muted-foreground hover:text-foreground"
      aria-label="Close"
      [disabled]="isDeleting()"
    >
      <ng-icon name="lucideX" size="18" />
    </button>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
