<div class="relative shrink-0">
  <!-- Photos come later; until then every mini shows the same placeholder. -->
  <div aria-hidden="true" class="size-10 rounded-md bg-muted bg-busy-stripes"></div>
  <app-row-check
    class="absolute -top-1.5 -left-1.5"
    [label]="'Select ' + row().name"
    [isSelected]="isSelected()"
    [isVisible]="isSelectionMode()"
    (selectedChange)="selectedChange.emit($event)"
  />
</div>

<div class="flex min-w-0 flex-1 flex-col">
  <div class="flex min-w-0 items-center gap-2">
    <!-- A click bubbles to the line, which opens or selects it; the button lets keyboards do the same. -->
    <button
      type="button"
      class="truncate rounded-sm text-left font-semibold focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      data-testid="hoard-row-open"
    >
      <app-either-or-name [name]="row().name" />
    </button>
    @if (row().isOnWorkbench) {
      <span hlmBadge variant="secondary" class="text-muted-foreground">Workbench</span>
    }
  </div>
  <span class="truncate text-sm text-muted-foreground">
    @if (row().box; as box) {
      <app-either-or-name [name]="box" />
      @if (row().boxNumber; as number) {
        #{{ number }}
      }
    } @else {
      Without box
    }
  </span>
</div>

@if (row().departure; as departure) {
  <app-gone-badge class="shrink-0" [reason]="departure.reason" />
} @else {
  <app-status-badge class="shrink-0" [status]="row().status" />
}
