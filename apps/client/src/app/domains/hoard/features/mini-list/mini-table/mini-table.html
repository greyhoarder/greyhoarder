<div hlmTableContainer>
  <table hlmTable data-testid="hoard-table">
    <thead hlmTHead>
      <tr hlmTr>
        <th hlmTh class="w-10"><span class="sr-only">Selection</span></th>
        @for (column of columns; track column.order) {
          <th hlmTh [attr.aria-sort]="ariaSort(column)" [class.text-right]="column.isNumeric">
            <button
              type="button"
              class="inline-flex items-center gap-1 rounded-md py-1 font-medium hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
              [class.text-foreground]="column.order === sortOrder()"
              [attr.data-testid]="'hoard-sort-' + column.order"
              (click)="sortBy(column.order)"
            >
              {{ column.label }}
              @if (column.order !== sortOrder()) {
                <ng-icon name="lucideChevronsUpDown" size="14" class="opacity-50" />
              } @else if (sortDirection() === 'ascending') {
                <ng-icon name="lucideArrowUp" size="14" />
              } @else {
                <ng-icon name="lucideArrowDown" size="14" />
              }
            </button>
          </th>
        }
        <th hlmTh class="w-10"><span class="sr-only">Menu</span></th>
      </tr>
    </thead>
    <tbody hlmTBody>
      @for (row of sortedRows(); track row.id) {
        <tr
          hlmTr
          class="group cursor-pointer"
          data-testid="hoard-row"
          [class.bg-primary/5]="selectedIds().has(row.id)"
          (click)="onRowClick(row)"
        >
          <td hlmTd>
            <app-row-check
              [label]="'Select ' + row.name"
              [isSelected]="selectedIds().has(row.id)"
              [isVisible]="isSelectionMode()"
              (selectedChange)="select(row, $event)"
            />
          </td>
          <td hlmTd class="max-w-64">
            <div class="flex min-w-0 items-center gap-2">
              <!-- A click bubbles to the line, which opens or selects it; the button lets keyboards do the same. -->
              <button
                type="button"
                class="truncate rounded-sm text-left font-medium focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
              >
                {{ row.name }}
              </button>
              @if (row.isOnWorkbench) {
                <span hlmBadge variant="secondary" class="text-muted-foreground">Workbench</span>
              }
            </div>
            @if (row.parts.length > 0) {
              <div class="truncate text-xs text-muted-foreground">{{ row.parts.join(', ') }}</div>
            }
          </td>
          <td hlmTd class="text-muted-foreground">{{ row.factions.join(', ') }}</td>
          <td hlmTd class="text-muted-foreground">{{ row.box ?? 'Without box' }}</td>
          <td hlmTd><app-status-badge [status]="row.status" /></td>
          <td hlmTd class="text-right font-semibold tabular-nums">×{{ row.count }}</td>
          <td hlmTd>
            <!-- The menu of the row comes with editing. -->
            <button
              hlmBtn
              variant="ghost"
              size="icon"
              type="button"
              class="text-muted-foreground"
              aria-label="More actions"
              data-testid="hoard-row-menu"
              (click)="$event.stopPropagation()"
            >
              <ng-icon name="lucideEllipsisVertical" size="16" />
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
