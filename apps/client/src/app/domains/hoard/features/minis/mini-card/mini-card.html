<div class="relative shrink-0">
  <!-- Photos come later; until then every row shows the same placeholder. -->
  <div
    aria-hidden="true"
    class="size-12 rounded-lg bg-muted bg-busy-stripes text-muted-foreground sm:size-14"
  ></div>
  <app-row-check
    class="absolute -top-1.5 -left-1.5"
    [label]="'Select ' + row().name"
    [isSelected]="isSelected()"
    [isVisible]="isSelectionMode()"
    (selectedChange)="selectedChange.emit($event)"
  />
</div>

<div class="flex min-w-0 flex-1 flex-col gap-0.5">
  <div class="flex min-w-0 items-center gap-2">
    <span class="truncate font-semibold">{{ row().name }}</span>
    @if (row().isOnWorkbench) {
      <span hlmBadge variant="secondary" class="text-muted-foreground">Workbench</span>
    }
  </div>
  <span class="truncate text-sm text-muted-foreground">{{ origin() }}</span>
  <!-- Always present, so rows without parts are as tall as the others. -->
  <span class="min-h-5 truncate text-sm text-muted-foreground">{{ parts() }}</span>
</div>

<div class="flex shrink-0 flex-col items-end gap-1 sm:flex-row sm:items-center sm:gap-6">
  <app-status-badge [status]="row().status" />
  <span
    class="text-base font-semibold sm:w-12 sm:text-right"
    [attr.aria-label]="row().count + ' minis'"
  >
    ×{{ row().count }}
  </span>
</div>

<!-- The menu of the row comes with editing. -->
<button
  hlmBtn
  variant="ghost"
  size="icon"
  type="button"
  class="-mr-2 shrink-0 text-muted-foreground"
  aria-label="More actions"
  data-testid="hoard-row-menu"
  (click)="$event.stopPropagation()"
>
  <ng-icon name="lucideEllipsisVertical" size="16" />
</button>
