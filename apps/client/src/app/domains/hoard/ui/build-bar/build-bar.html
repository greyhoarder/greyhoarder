<p class="min-w-0 flex-1 basis-64 text-sm" data-testid="mini-build-summary">
  {{ summary() }}
</p>
<div class="flex flex-wrap items-center gap-4">
  @if (rowSize() > 1) {
    <app-count-stepper
      label="How many to build"
      testId="mini-build"
      [count]="count()"
      [max]="rowSize()"
      (changed)="countChanged.emit($event)"
    />
  }
  <div class="flex items-center gap-2 text-sm">
    <hlm-checkbox
      data-testid="mini-build-workbench"
      [inputId]="workbenchId"
      [checked]="isOnWorkbench()"
      (checkedChange)="workbenchChange.emit($event)"
    />
    <label [for]="workbenchId">Put on workbench</label>
  </div>
  <button
    hlmBtn
    type="button"
    class="h-10 px-4 text-sm font-semibold"
    data-testid="mini-build"
    [disabled]="isBuilding() || name() === ''"
    [attr.aria-busy]="isBuilding()"
    (click)="built.emit()"
  >
    <ng-icon name="lucideHammer" size="16" />
    @if (isBuilding()) {
      Building…
    } @else if (count() === 1) {
      Build mini
    } @else {
      Build {{ count() }} minis
    }
  </button>
</div>
