<div class="flex min-h-13 items-center gap-2">
  <span class="min-w-0 truncate px-1 text-sm font-semibold" [attr.data-testid]="screen() + '-selection-count'">
    {{ count() }} {{ count() === 1 ? 'mini' : 'minis' }} selected
  </span>
  <button
    hlmBtn
    variant="ghost"
    type="button"
    class="h-10 px-3 text-sm text-muted-foreground hover:bg-transparent hover:text-foreground dark:hover:bg-transparent"
    [attr.data-testid]="screen() + '-select-done'"
    (click)="finished.emit()"
  >
    Reset
    <ng-icon name="lucideX" size="16" />
  </button>
  <span class="flex-1"></span>
  <button
    hlmBtn
    variant="outline"
    type="button"
    class="h-10 px-3.5 text-sm"
    [disabled]="count() === 0"
    [attr.data-testid]="screen() + '-selection-edit'"
    (click)="editChosen.emit()"
  >
    Edit
  </button>
  <button
    hlmBtn
    variant="outline"
    type="button"
    class="hidden h-10 px-3.5 text-sm @xl:inline-flex"
    [disabled]="!canLeave()"
    [attr.data-testid]="screen() + '-selection-leave'"
    (click)="leaveChosen.emit()"
  >
    Leave the hoard…
  </button>
  <span class="mx-1 hidden h-6 w-px bg-border @xl:block" aria-hidden="true"></span>
  <button
    hlmBtn
    variant="outline"
    type="button"
    class="hidden h-10 border-destructive/50 px-3.5 text-sm text-destructive hover:text-destructive @xl:inline-flex dark:border-destructive/50"
    [disabled]="count() === 0"
    [attr.data-testid]="screen() + '-selection-delete'"
    (click)="deleteChosen.emit()"
  >
    Delete
  </button>

  <hlm-popover class="@xl:hidden" align="end" sideOffset="6">
    <button
      hlmPopoverTrigger
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      class="size-10"
      aria-label="More actions for the selection"
      [attr.aria-haspopup]="'menu'"
      [attr.data-testid]="screen() + '-selection-menu'"
    >
      <ng-icon name="lucideEllipsisVertical" size="16" />
    </button>
    <ul hlmPopoverContent class="w-48 gap-0 p-1" role="menu" aria-label="Selection" *hlmPopoverPortal="let menu">
      @for (item of menuItems; track item.action) {
        <li role="none">
          <button
            type="button"
            role="menuitem"
            [attr.tabindex]="$first ? 0 : -1"
            class="flex w-full rounded-md px-2 py-1.5 text-left text-sm outline-none hover:bg-accent focus-visible:bg-accent disabled:pointer-events-none disabled:opacity-50"
            [class.text-destructive]="item.isDestructive"
            [disabled]="isDisabled(item.action)"
            (click)="choose(item.action); menu.close()"
          >
            {{ item.label }}
          </button>
        </li>
      }
    </ul>
  </hlm-popover>
</div>
