<hlm-alert-dialog
  [state]="isOpen() ? 'open' : 'closed'"
  [disableClose]="isDeleting()"
  autoFocus="[data-slot=alert-dialog-cancel]"
  (closed)="closed.emit()"
>
  <hlm-alert-dialog-content *hlmAlertDialogPortal [attr.data-testid]="screen() + '-delete-dialog'">
    <hlm-alert-dialog-header>
      <hlm-alert-dialog-media class="bg-destructive/15 text-destructive">
        <ng-icon name="lucideTrash2" size="22" />
      </hlm-alert-dialog-media>
      <h2 hlmAlertDialogTitle>
        {{ count() === 1 ? 'Delete this mini for good?' : 'Delete ' + count() + ' minis for good?' }}
      </h2>
      <p hlmAlertDialogDescription>This can't be undone.</p>
    </hlm-alert-dialog-header>
    <div class="flex flex-col gap-3 px-6 pt-6">
      <p class="flex min-h-24 items-center justify-center rounded-lg bg-muted px-4 py-3 text-center text-sm">
        {{ names() }}
      </p>
      @if (hasFailed()) {
        <p class="text-sm text-destructive" role="alert" [attr.data-testid]="screen() + '-delete-error'">
          Can't delete right now. Try again in a moment.
        </p>
      }
    </div>
    <hlm-alert-dialog-footer>
      <button hlmAlertDialogCancel [disabled]="isDeleting()" [attr.data-testid]="screen() + '-delete-cancel'">
        Cancel
      </button>
      <button
        hlmAlertDialogAction
        variant="destructive"
        class="font-semibold"
        [disabled]="isDeleting()"
        [attr.aria-busy]="isDeleting()"
        [attr.data-testid]="screen() + '-delete-confirm'"
        (click)="confirmed.emit()"
      >
        {{ count() === 1 ? 'Delete mini' : 'Delete ' + count() + ' minis' }}
      </button>
    </hlm-alert-dialog-footer>
    <!-- Last, so the focus starts on "Cancel" and not here. -->
    <button
      hlmAlertDialogCancel
      variant="ghost"
      size="icon"
      class="absolute top-3 right-3 size-9 border-0 text-muted-foreground hover:text-foreground"
      aria-label="Close"
      [disabled]="isDeleting()"
    >
      <ng-icon name="lucideX" size="18" />
    </button>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
