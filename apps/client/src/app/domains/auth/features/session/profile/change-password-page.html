<a
  routerLink="/profile"
  class="inline-flex w-fit items-center gap-1 text-sm text-muted-foreground hover:text-foreground"
  data-testid="change-password-back"
>
  <ng-icon name="lucideChevronLeft" size="16" />
  Profile
</a>

<h1 class="text-2xl font-semibold">Change password</h1>

<form hlmFieldGroup novalidate (submit)="change($event)">
  <div hlmField>
    <label hlmFieldLabel for="change-password-current" class="text-base">Current password</label>
    <input
      hlmInput
      id="change-password-current"
      data-testid="change-password-current"
      type="password"
      autocomplete="current-password"
      class="h-10"
      (input)="type('current', $event)"
    />
  </div>
  <div hlmField>
    <label hlmFieldLabel for="change-password-new" class="text-base">New password</label>
    <input
      hlmInput
      id="change-password-new"
      data-testid="change-password-new"
      type="password"
      autocomplete="new-password"
      class="h-10"
      (input)="type('new', $event)"
    />
    <app-password-strength [password]="newPassword()" />
  </div>
  <div hlmField>
    <label hlmFieldLabel for="change-password-repeat" class="text-base">Repeat new password</label>
    <input
      hlmInput
      id="change-password-repeat"
      data-testid="change-password-repeat"
      type="password"
      autocomplete="new-password"
      class="h-10"
      (input)="type('repeated', $event)"
    />
  </div>
  @if (failure(); as text) {
    <p class="text-sm text-destructive" role="alert" data-testid="change-password-error">{{ text }}</p>
  }
  <div class="flex justify-end gap-2">
    <a hlmBtn variant="ghost" class="h-10" routerLink="/profile" data-testid="change-password-cancel">Cancel</a>
    <button
      hlmBtn
      type="submit"
      class="h-10 font-semibold"
      data-testid="change-password-submit"
      [disabled]="isChanging()"
      [attr.aria-busy]="isChanging()"
    >
      Change password
    </button>
  </div>
</form>
