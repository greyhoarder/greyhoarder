<!-- Built like the header of the hoard, so that both pages have everything in the same place. -->
<header class="flex flex-wrap items-start justify-between gap-4">
  <div class="flex flex-col gap-1">
    <h1 class="text-2xl font-semibold" data-testid="settings-title">Settings</h1>
    <p class="text-muted-foreground" data-testid="settings-summary">What concerns this whole instance</p>
  </div>
  @if (isUsersTab()) {
    <a hlmBtn class="h-10 px-4 text-sm font-semibold" routerLink="users/add" data-testid="users-add">
      <ng-icon name="lucidePlus" size="16" />
      Add user
    </a>
  }
</header>

<div class="flex flex-wrap items-end justify-between gap-3 border-b">
  <nav class="-mb-px flex h-11 gap-4" aria-label="Settings">
    <a
      routerLink="general"
      routerLinkActive="text-foreground after:opacity-100"
      ariaCurrentWhenActive="page"
      class="relative inline-flex items-center gap-1.5 px-1 text-base font-medium text-muted-foreground transition-colors after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 after:bg-primary after:opacity-0 hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      data-testid="settings-tab-general"
    >
      General
    </a>
    @if (isAdministrator()) {
      <a
        routerLink="users"
        routerLinkActive="text-foreground after:opacity-100"
        ariaCurrentWhenActive="page"
        class="relative inline-flex items-center gap-1.5 px-1 text-base font-medium text-muted-foreground transition-colors after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 after:bg-primary after:opacity-0 hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        data-testid="settings-tab-users"
      >
        Users
      </a>
    }
  </nav>
</div>

<!-- The page is rendered next to the outlet; hidden, the outlet adds no extra gap. -->
<router-outlet class="hidden" />
