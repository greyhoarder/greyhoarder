# Development environment: the workspace plus MongoDB and Redis.
name: greyhoarder-dev

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
    command: sleep infinity
    # Published on the host, so the client is reachable at http://<host>:4200
    # without VS Code forwarding (e.g. a dev LXC). The API goes through its proxy.
    ports:
      - '4200:4200'
    environment:
      # Override the development defaults, which point to 127.0.0.1.
      MONGODB_URI: mongodb://mongo:27017/greyhoarder?directConnection=true
      REDIS_URL: redis://redis:6379
    volumes:
      - ..:/workspaces/greyhoarder:cached
      # Linux packages in volumes, so they never mix with a host install
      # (native modules such as Argon2 and oxlint differ per OS).
      - node-modules:/workspaces/greyhoarder/node_modules
      - client-node-modules:/workspaces/greyhoarder/apps/client/node_modules
      - server-node-modules:/workspaces/greyhoarder/apps/server/node_modules
      - protocol-node-modules:/workspaces/greyhoarder/libs/protocol/node_modules
      - claude-config:/home/node/.claude
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  mongo:
    image: mongo:8
    # Single-node replica set, so multi-document transactions work (ADR-0005).
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
  node-modules:
  client-node-modules:
  server-node-modules:
  protocol-node-modules:
  claude-config:
